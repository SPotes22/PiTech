version: '3.8'

services:
  web:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "5000:5000"
      - "5001:5001"
      - "5002:5002"
    environment:
      - DATABASE_PATH=/app/data/audit.db
      - VAULT_PATH=/app/data/vault
    command: bash -c "pip install -r requirements.txt && python src/main.py"
